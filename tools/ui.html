<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>scalper</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--line:#232a33;--fg:#c9d1d9;--dim:#7d8590;--up:#3fb950;--dn:#f85149;--warn:#d29922;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:22px 0 8px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.kv span:first-child{color:var(--dim)}
.big{font-size:20px;font-weight:600}
.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}.dim{color:var(--dim)}.acc{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:500;padding:5px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:5px 8px;border-bottom:1px solid #1b2129;white-space:nowrap}
tr:hover td{background:#1b2129}
.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line)}
.scroll{max-height:420px;overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tab{padding:5px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--dim);user-select:none}
.tab.on{color:var(--fg);border-color:var(--acc);background:#132030}
.hide{display:none}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--fg);font:inherit;
  padding:5px 14px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.5;cursor:default;border-color:var(--line);color:var(--dim)}
/* Settings values are read straight from config.json, so their length is not under this
   page's control. Fixed layout plus wrapping means no single value can widen the table and
   push the others out of view — which a stray prose `note` did. */
.cfg{table-layout:fixed;width:100%}
.cfg td:first-child{width:58%;color:var(--dim)}
.cfg td:last-child{width:42%;word-break:break-word;white-space:normal}
svg{display:block;width:100%;height:auto;overflow:visible}
.foot{color:var(--dim);font-size:11px;margin-top:22px;text-align:center}
.ca{cursor:pointer;border-bottom:1px dotted #2f3b48}
.ca:hover{color:#8fc6ff;border-bottom-color:#58a6ff}
.ca.copied{color:var(--up);border-bottom-color:var(--up)}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1f6feb;color:#fff;
  padding:6px 14px;border-radius:6px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:640px){.wrap{padding:8px}td,th{padding:4px 5px;font-size:11px}.big{font-size:17px}}
</style></head><body><div class="wrap">

<div style="display:flex;justify-content:flex-end;margin-bottom:8px">
  <button id="refresh" class="btn">refresh</button>
</div>
<div class="panel" id="status"></div>

<h2>Open positions</h2>
<div class="panel" id="open"></div>

<h2>Performance</h2>
<div class="grid g4" id="stats"></div>

<div class="tabs" id="tabs">
  <div class="tab on" data-t="equity">equity curve</div>
  <div class="tab" data-t="excursion">excursion vs target</div>
  <div class="tab" data-t="wallets">by wallet</div>
  <div class="tab" data-t="reasons">by exit reason</div>
  <div class="tab" data-t="rejected">rejected</div>
  <div class="tab" data-t="config">settings</div>
</div>
<div class="panel" id="chart"></div>

<h2>Trades</h2>
<div class="panel scroll" id="trades"></div>

<div class="foot" id="foot"></div>
<div id="toast"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const usd = n => (n<0?"-$":"$") + Math.abs(n).toFixed(2);
const pct = n => (n>=0?"+":"") + n.toFixed(2) + "%";
const cls = n => n>0?"up":n<0?"dn":"dim";
const mc = n => n==null?"—":n>=1e6?"$"+(n/1e6).toFixed(2)+"M":n>=1e3?"$"+Math.round(n/1e3)+"k":"$"+Math.round(n);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
/* Full address in the DOM, shortened only for display — hover shows it, click copies it.
   A truncated CA you cannot recover is useless the moment you want to look a token up. */
const ca = a => `<span class="ca" data-ca="${esc(a)}" title="${esc(a)} — click to copy">${esc(a.slice(0,6))}…${esc(a.slice(-4))}</span>`;
let S = null, tab = "equity";

function statusPanel(d){
  const b = d.breaker, run = d.process.running;
  const anchorDelta = d.wallet.balanceUsd - (d.anchor || d.wallet.balanceUsd);
  $("#status").innerHTML = `
  <div class="grid g4">
    <div><div class="dim">bot</div><div class="big ${run?"up":"dn"}">${run?"RUNNING":"STOPPED"}</div>
      <div class="dim">${run?esc(d.process.uptime):"not running"}</div></div>
    <div><div class="dim">balance</div><div class="big">${usd(d.wallet.balanceUsd)}</div>
      <div class="dim">${d.wallet.nativeEth.toFixed(5)} ETH · <span class="${cls(anchorDelta)}">${pct(d.anchor?anchorDelta/d.anchor*100:0)}</span> vs anchor</div></div>
    <div><div class="dim">tradable</div><div class="big">${usd(d.wallet.tradableUsd)}</div>
      <div class="dim">${usd(d.wallet.gasReserveUsd)} gas reserve</div></div>
    <div><div class="dim">breaker</div><div class="big ${b.tripped?"dn":"up"}">${b.tripped?"TRIPPED":"ARMED"}</div>
      <div class="dim">${b.tripped?esc(b.reasons.join("; ")):`${b.consecutiveLosses}/${b.maxConsecutiveLosses} losses · ${pct(b.windowPnlPct)} 24h`}</div></div>
    <div><div class="dim">position size</div><div class="big">${usd(d.config.positionUsd)}</div>
      <div class="dim">${esc(d.config.positionSource)} · max ${d.config.maxConcurrent}</div></div>
    <div><div class="dim">gas</div><div class="big">${d.wallet.gwei.toFixed(3)}</div>
      <div class="dim">gwei · ${d.wallet.roundTrips} round trips left</div></div>
    <div><div class="dim">wallets</div><div class="big">${d.config.wallets}</div>
      <div class="dim">tracked · ${esc(d.config.router)} router</div></div>
    <div><div class="dim">ETH</div><div class="big">$${d.wallet.ethUsd.toFixed(0)}</div>
      <div class="${/DISAGREE/.test(d.wallet.ethUsdSource||"")?"warn":"dim"}" style="font-size:11px">${esc(d.wallet.ethUsdSource||"")}</div></div>
  </div>`;
}

function openPanel(d){
  if(!d.open.length){ $("#open").innerHTML = '<div class="dim">none</div>'; return; }
  $("#open").innerHTML = `<table><tr><th>token</th><th>CA</th><th>source</th><th class="num">mcap</th><th>tier</th><th class="num">cost</th><th class="num">now</th>
    <th class="num">P&L</th><th class="num">target</th><th class="num">stop</th><th class="num">age</th></tr>` +
    d.open.map(p=>`<tr><td>${p.symbol?esc(p.symbol):'<span class="dim">?</span>'}</td>
      <td class="acc">${ca(p.token)}</td><td>${esc(p.source)}</td>
      <td class="num dim">${mc(p.mcapUsd)}</td>
      <td><span class="pill">${esc(p.tier)}</span></td>
      <td class="num">${usd(p.costUsd)}</td>
      <td class="num">${p.markUsd==null?'<span class="dn">UNROUTABLE</span>':usd(p.markUsd)}</td>
      <td class="num ${cls(p.pnlUsd||0)}">${p.pnlUsd==null?"—":usd(p.pnlUsd)+" "+pct(p.pnlPct)}</td>
      <td class="num">+${p.takeProfitPct}%</td><td class="num">-${p.stopLossPct}%</td>
      <td class="num dim">${p.ageMin}m</td></tr>`).join("") + `</table>`;
}

function statsPanel(d){
  const s = d.stats;
  const card = (label,val,sub,c) => `<div class="panel"><div class="dim">${label}</div>
    <div class="big ${c||""}">${val}</div><div class="dim">${sub}</div></div>`;
  const gasShare = s.grossUsd > 0 ? (s.totalGasUsd / s.grossUsd * 100) : 0;
  $("#stats").innerHTML =
    card("gross P&L", usd(s.grossUsd), "before gas", cls(s.grossUsd)) +
    card("gas paid", "-"+usd(s.totalGasUsd), s.gasKnown < s.n ? `${s.gasKnown}/${s.n} measured` : `${gasShare.toFixed(0)}% of gross`, "warn") +
    card("unrecorded losses", "-"+usd(s.unrecordedLossUsd), "sold by hand, ~$0 recovered", s.unrecordedLossUsd>0?"dn":"dim") +
    card("net P&L", usd(s.trueNetUsd), `${s.n} trades, after gas + stuck`, cls(s.trueNetUsd)) +
    card("win rate", s.winPct.toFixed(0)+"%", `${s.wins}W / ${s.n-s.wins}L`) +
    card("today", usd(s.todayUsd), `${s.todayN} trades · ${usd(s.todayGasUsd)} gas`, cls(s.todayUsd)) +
    card("avg trade", usd(s.avgUsd), `median hold ${s.medianHold}s`, cls(s.avgUsd));
}

function svgLine(pts,w,h,color){
  if(pts.length<2) return "";
  const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys,0),y1=Math.max(...ys,0);
  const sx=v=>(x1===x0?0:(v-x0)/(x1-x0))*w, sy=v=>h-(y1===y0?h/2:(v-y0)/(y1-y0)*h);
  const d=pts.map((p,i)=>(i?"L":"M")+sx(p[0]).toFixed(1)+" "+sy(p[1]).toFixed(1)).join(" ");
  const zero=sy(0);
  return `<svg viewBox="0 0 ${w} ${h+18}"><line x1="0" y1="${zero}" x2="${w}" y2="${zero}" stroke="#2a323c" stroke-dasharray="3 3"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.8"/>
    <text x="2" y="${h+14}" fill="#7d8590" font-size="10">${y0.toFixed(2)} … ${y1.toFixed(2)}</text></svg>`;
}

function chartPanel(d){
  const el=$("#chart");
  if(tab==="equity"){
    let c=0; const pts=d.trades.slice().reverse().map((t,i)=>{c+=t.pnlUsd;return [i,c];});
    el.innerHTML = `<div class="dim" style="margin-bottom:6px">cumulative realised P&L, oldest first</div>`+
      svgLine(pts,1100,180,"#58a6ff");
  } else if(tab==="excursion"){
    const rows=d.trades.filter(t=>t.peakPct!=null).slice(0,60);
    if(!rows.length){el.innerHTML='<div class="dim">no excursion data</div>';return;}
    const w=1100,h=Math.max(160,rows.length*13),bw=w/rows.length;
    const all=rows.flatMap(t=>[t.peakPct,t.troughPct,t.takeProfitPct,-t.stopLossPct]);
    const lo=Math.min(...all,0), hi=Math.max(...all,0);
    const sy=v=>h-((v-lo)/(hi-lo))*h;
    let bars=rows.map((t,i)=>{
      const x=i*bw+bw*0.2, ww=Math.max(2,bw*0.6);
      return `<rect x="${x}" y="${sy(t.peakPct)}" width="${ww}" height="${Math.max(1,sy(t.troughPct)-sy(t.peakPct))}" fill="#2f3b48"/>`
        +`<line x1="${x}" y1="${sy(t.takeProfitPct)}" x2="${x+ww}" y2="${sy(t.takeProfitPct)}" stroke="#3fb950" stroke-width="1.5"/>`
        +`<line x1="${x}" y1="${sy(-t.stopLossPct)}" x2="${x+ww}" y2="${sy(-t.stopLossPct)}" stroke="#f85149" stroke-width="1.5"/>`
        +`<rect x="${x}" y="${sy(Math.max(t.pnlPct,0))}" width="${ww}" height="${Math.max(1,Math.abs(sy(t.pnlPct)-sy(0)))}" fill="${t.pnlPct>=0?"#3fb95055":"#f8514955"}"/>`;
    }).join("");
    const hit=rows.filter(t=>t.peakPct>=t.takeProfitPct).length;
    el.innerHTML=`<div class="dim" style="margin-bottom:6px">grey = peak-to-trough range · <span class="up">green line = take-profit</span> · <span class="dn">red line = stop</span> · filled = realised.
      <b>${hit}/${rows.length}</b> ever reached their target.</div>
      <svg viewBox="0 0 ${w} ${h}"><line x1="0" y1="${sy(0)}" x2="${w}" y2="${sy(0)}" stroke="#2a323c"/>${bars}</svg>`;
  } else if(tab==="wallets"){
    el.innerHTML=`<table><tr><th>wallet</th><th class="num">n</th><th class="num">net</th><th class="num">win%</th><th class="num">avg</th></tr>`+
      d.byWallet.map(w=>`<tr><td>${esc(w.name)}</td><td class="num">${w.n}</td>
      <td class="num ${cls(w.pnl)}">${usd(w.pnl)}</td><td class="num">${w.winPct.toFixed(0)}%</td>
      <td class="num ${cls(w.avg)}">${usd(w.avg)}</td></tr>`).join("")+`</table>`;
  } else if(tab==="rejected"){
    const rs=d.rejections||[];
    if(!rs.length){el.innerHTML='<div class="dim">no rejected BUY signals in the current log</div>';return;}
    el.innerHTML=`<div class="dim" style="margin-bottom:6px">BUY signals the bot refused, newest first.
      Airdrop/RECEIVED noise is excluded — only real candidates.</div>
      <div class="scroll"><table><tr><th>when</th><th>token</th><th>CA</th><th>source</th>
      <th class="num">size</th><th class="num">their mcap</th><th>why</th></tr>`+
      rs.map(r=>`<tr><td class="dim">${esc(r.when)}</td>
        <td>${r.symbol?esc(r.symbol):'<span class="dim">?</span>'}</td>
        <td class="acc">${ca(r.token)}</td><td>${esc(r.wallet)}</td>
        <td class="num">${r.sizeUsd==null?"—":usd(r.sizeUsd)}</td>
        <td class="num dim">${r.mcap?"$"+esc(r.mcap):"—"}</td>
        <td class="${r.kind==="abort"?"warn":"dim"}" style="white-space:normal">${r.kind==="abort"?"<b>abort</b> · ":""}${esc(r.reason)}</td>
      </tr>`).join("")+`</table></div>`;
  } else if(tab==="config"){
    const t=d.tunables;
    el.innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
      <div><div class="dim" style="margin-bottom:6px">take-profit by market cap</div>
        <table class="cfg">${t.tiers.map(x=>`<tr><td>${esc(x.band)}</td><td class="num up">+${x.takeProfitPct}%</td></tr>`).join("")}</table></div>
      ${t.groups.map(g=>`<div><div class="dim" style="margin-bottom:6px">${esc(g.name)}</div>
        <table class="cfg">${g.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="num">${esc(r[1])}</td></tr>`).join("")}</table></div>`).join("")}
    </div>
    <div class="dim" style="margin-top:10px">read live from config.json — this cannot disagree with what the bot is using</div>`;
  } else {
    el.innerHTML=`<table><tr><th>exit reason</th><th class="num">n</th><th class="num">net</th><th class="num">avg%</th></tr>`+
      d.byReason.map(r=>`<tr><td>${esc(r.reason)}</td><td class="num">${r.n}</td>
      <td class="num ${cls(r.pnl)}">${usd(r.pnl)}</td><td class="num ${cls(r.avgPct)}">${pct(r.avgPct)}</td></tr>`).join("")+`</table>`;
  }
}

function tradesPanel(d){
  $("#trades").innerHTML=`<table><tr><th>closed</th><th>source</th><th>token</th><th>CA</th><th class="num">mcap</th><th>tier</th><th class="num">cost</th>
    <th class="num">gas</th><th class="num">P&L</th><th class="num">%</th><th class="num">peak</th><th class="num">trough</th><th>reason</th><th class="num">held</th></tr>`+
    d.trades.slice(0,80).map(t=>`<tr><td class="dim">${esc(t.when)}</td><td>${esc(t.source)}</td>
      <td>${t.symbol?esc(t.symbol):'<span class="dim">?</span>'}</td>
      <td class="acc">${ca(t.token)}</td>
      <td class="num dim">${t.mcapUsd==null?"—":mc(t.mcapUsd)}</td>
      <td><span class="pill">${t.tier?esc(t.tier):"—"} <span class="dim">+${t.takeProfitPct}%</span></span></td>
      <td class="num">${usd(t.costUsd)}</td>
      <td class="num warn">${t.gasUsd==null?'<span class="dim">—</span>':"-"+usd(t.gasUsd)}</td>
      <td class="num ${cls(t.pnlUsd)}">${usd(t.pnlUsd)}</td><td class="num ${cls(t.pnlPct)}">${pct(t.pnlPct)}</td>
      <td class="num dim">${t.peakPct==null?"—":pct(t.peakPct)}</td>
      <td class="num dim">${t.troughPct==null?"—":pct(t.troughPct)}</td>
      <td><span class="pill">${esc(t.reason)}</span></td><td class="num dim">${t.heldSec}s</td></tr>`).join("")+`</table>`;
}

async function load(fresh){
  const btn=$("#refresh");
  if(fresh){ btn.disabled=true; btn.textContent="refreshing…"; }
  try{
    const q=new URLSearchParams(location.search);
    if(fresh) q.set("fresh","1");
    const r = await fetch("api/state"+(q.toString()?"?"+q:""));
    if(!r.ok){ $("#foot").textContent = "api error "+r.status; return; }
    S = await r.json();
    statusPanel(S); openPanel(S); statsPanel(S); chartPanel(S); tradesPanel(S);
    $("#foot").textContent = "updated "+new Date().toLocaleTimeString()+(fresh?" (forced)":"")+" · read-only · "+S.meta.note;
  }catch(e){ $("#foot").textContent = "unreachable — is the ui server running?"; }
  finally{ if(fresh){ btn.disabled=false; btn.textContent="refresh"; } }
}
$("#refresh").addEventListener("click",()=>load(true));
document.addEventListener("click", async e => {
  const el = e.target.closest(".ca"); if(!el) return;
  const v = el.dataset.ca;
  try { await navigator.clipboard.writeText(v); }
  catch { const t=document.createElement("textarea"); t.value=v; document.body.appendChild(t); t.select();
          document.execCommand("copy"); t.remove(); }
  el.classList.add("copied"); setTimeout(()=>el.classList.remove("copied"), 900);
  const toast=$("#toast"); toast.textContent="copied "+v; toast.classList.add("on");
  clearTimeout(window._tt); window._tt=setTimeout(()=>toast.classList.remove("on"), 1600);
});
$("#tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
  tab=t.dataset.t; if(S) chartPanel(S);
});
load(); setInterval(()=>load(false), 5000);
</script></body></html>
